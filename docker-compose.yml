name: skillscope

services:
  db:
    image: pgvector/pgvector:0.8.6-pg18-trixie
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-skillscope}
      POSTGRES_USER: ${POSTGRES_USER:-skillscope}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-skillscope}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-skillscope} -d ${POSTGRES_DB:-skillscope}",
        ]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 5s
    stop_grace_period: 10s

  db-test:
    image: pgvector/pgvector:0.8.6-pg18-trixie
    profiles:
      - test
    environment:
      POSTGRES_DB: skillscope_test
      POSTGRES_USER: skillscope_test
      POSTGRES_PASSWORD: skillscope_test
    ports:
      - "127.0.0.1:${POSTGRES_TEST_PORT:-5433}:5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U skillscope_test -d skillscope_test",
        ]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 5s
    stop_grace_period: 10s

  db-demo:
    image: pgvector/pgvector:0.8.6-pg18-trixie
    profiles:
      - app
    environment:
      POSTGRES_DB: skillscope_demo
      POSTGRES_USER: skillscope_demo
      POSTGRES_PASSWORD: skillscope_demo
    volumes:
      - demo_postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U skillscope_demo -d skillscope_demo",
        ]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 5s
    stop_grace_period: 10s

  api:
    profiles:
      - app
    build:
      context: .
    environment:
      ENVIRONMENT: production
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: postgresql+psycopg://skillscope_demo:skillscope_demo@db-demo:5432/skillscope_demo
      FRONTEND_ORIGIN: http://localhost:${FRONTEND_PORT:-5173}
      # The image ships no model runtime, so the container stack serves the
      # committed demonstration corpus rather than the evaluated one.
      BM25_CONFIG_PATH: config/demo/bm25-v1.json
      DENSE_CONFIG_PATH: config/demo/dense-hybrid-v1.json
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      db-demo:
        condition: service_healthy
      demo-loader:
        condition: service_completed_successfully
    volumes:
      - demo_evidence:/app/data/demo/generated
      - demo_config:/app/config/demo
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=3).status == 200 else 1)\"",
        ]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 10s
    stop_grace_period: 10s

  demo-loader:
    profiles:
      - app
    build:
      context: .
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: postgresql+psycopg://skillscope_demo:skillscope_demo@db-demo:5432/skillscope_demo
    depends_on:
      db-demo:
        condition: service_healthy
    volumes:
      - demo_evidence:/app/data/demo/generated
      - demo_config:/app/config/demo
    # Migrations and the token-free corpus load are one explicit step, so the
    # API never runs against an unmigrated or empty database.
    command:
      - sh
      - -c
      - |
        set -e
        alembic upgrade head
        skillscope demo load
    restart: "no"

  frontend:
    profiles:
      - app
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:${API_PORT:-8000}
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:8080"
    depends_on:
      api:
        condition: service_healthy
    stop_grace_period: 5s

volumes:
  postgres_data:
  demo_postgres_data:
  demo_evidence:
  demo_config: