# Dependabot keeps the locked dependencies, base images and pinned actions
# current. Actions are pinned to commit SHAs, which Dependabot updates in place
# while keeping the version comment accurate.
version: 2

updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"

  - package-ecosystem: docker
    directories:
      - /
      - /frontend
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
