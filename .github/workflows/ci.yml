name: CI

"on":
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-quality:
    name: Backend quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SKILLSCOPE_TEST_DATABASE_URL: postgresql+psycopg://skillscope_test:skillscope_test@127.0.0.1:5432/skillscope_test

    services:
      database:
        image: pgvector/pgvector:0.8.6-pg18-trixie
        env:
          POSTGRES_DB: skillscope_test
          POSTGRES_USER: skillscope_test
          POSTGRES_PASSWORD: skillscope_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U skillscope_test -d skillscope_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"
          python-version: "3.12"
          enable-cache: "auto"
          cache-dependency-glob: uv.lock

      - name: Sync locked dependencies
        run: uv sync --locked

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Type-check
        run: uv run mypy src

      - name: Apply database migrations
        run: uv run alembic upgrade head
        env:
          DATABASE_URL: ${{ env.SKILLSCOPE_TEST_DATABASE_URL }}

      - name: Check migration drift
        run: uv run alembic check
        env:
          DATABASE_URL: ${{ env.SKILLSCOPE_TEST_DATABASE_URL }}

      - name: Test with coverage
        run: >
          uv run pytest
          --cov=skillscope
          --cov-report=term-missing
          --cov-fail-under=80

  frontend-quality:
    name: Frontend quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  docker-smoke:
    name: Docker smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The stack loads the committed demonstration corpus, so this job needs
      # no GitHub token, no GitHub API call and no model download.
      - name: Build, start and probe the demonstration stack
        run: ./scripts/docker_smoke.sh